<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Club</title>
  <link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48" href="favicon.ico?v=2">
  <link rel="icon" type="image/svg+xml" sizes="any" href="favicon.svg?v=2">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <header>
      <p class="subtitle">პატარა კინოკლუბი</p>
      <h1>Movie Club</h1>
      <p>იპოვე ფილმი და დაამატე ფავორიტებში.</p>
    </header>

    <section class="filters" aria-label="ფილტრები">
      <label>ფილმის სახელი
        <input id="search" type="search" placeholder="მაგალითად: Interstellar">
      </label>
      <label>ჟანრი
        <select id="genre">
          <option value="all">ყველა ჟანრი</option>
          <option value="ფანტასტიკა">ფანტასტიკა</option>
          <option value="ანიმაცია">ანიმაცია</option>
          <option value="დრამა">დრამა</option>
        </select>
      </label>
      <label>გამოშვების წელი
        <select id="year">
          <option value="all">ყველა წელი</option>
          <option value="old">2010 წლამდე</option>
          <option value="new">2010 წლიდან</option>
        </select>
      </label>
    </section>

    <h2>ფილმები</h2>
    <div id="movies" class="cards" aria-live="polite"></div>

    <section class="favorites">
      <h2>ჩემი ფავორიტები (<span id="count">0</span>)</h2>
      <ul id="favorites-list" aria-live="polite"></ul>
    </section>
  </main>
</body>
</html>
